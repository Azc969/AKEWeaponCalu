<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon1.png" type="image/png">
    <title>终末地武库配额推算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 自定义背景：深邃的径向渐变 */
        body {
    /* 1. 替换下方的 URL 为你的图片链接 */
        background: 
            /* 深色遮罩，防止图片太亮 */
            url('background.png'); 
    
    /* 2. 让背景图全屏覆盖且不随页面滚动 */
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-xl glass-panel rounded-3xl shadow-2xl p-6 md:p-8 relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-sky-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-pink-500/10 rounded-full blur-3xl"></div>

        <h1 class="text-xl font-bold text-sky-400 mb-8 flex items-center border-b border-white/5 pb-5">
            <i data-lucide="shield-check" class="w-6 h-6 mr-3"></i>
            <span class="tracking-tight">终末地武库配额推算</span>
            <span class="ml-auto text-[10px] bg-sky-500/10 text-sky-500 px-2 py-1 rounded"></span>
        </h1>

        <div class="space-y-6">
            <div>
                <label class="flex items-center text-xs font-semibold uppercase tracking-widest text-slate-500 mb-3">
                    <i data-lucide="cpu" class="w-3 h-3 mr-2"></i> 计算逻辑
                </label>
                <select id="algoMode" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl p-3 text-sky-300 outline-none focus:ring-2 focus:ring-sky-500/30 transition-all cursor-pointer">
                    <option value="expected">综合期望模式</option>
                    <option value="worst" selected>非酋保底模式</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="flex items-center text-xs text-slate-400 mb-2">
                        <i data-lucide="database" class="w-3 h-3 mr-2"></i> 当前配额
                    </label>
                    <input type="number" id="currentQuota" value="0" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3 text-yellow-400 font-mono outline-none focus:border-yellow-500/50">
                </div>
                <div>
                    <label class="flex items-center text-xs text-slate-400 mb-2">
                        <i data-lucide="droplets" class="w-3 h-3 mr-2"></i> 已垫抽数
                    </label>
                    <input type="number" id="pityCount" value="30" min="0" max="79" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3 text-pink-400 font-mono outline-none focus:border-pink-500/50">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="flex items-center text-xs text-slate-400 mb-2">
                        <i data-lucide="send" class="w-3 h-3 mr-2"></i> 计划投入 (抽)
                    </label>
                    <input type="number" id="pulls" value="120" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3 text-sky-300 font-mono outline-none focus:border-sky-500/50 transition-all">
                </div>
                <div>
                    <label class="flex items-center text-xs text-slate-400 mb-2">
                        <i data-lucide="calendar" class="w-3 h-3 mr-2"></i> 攒抽时长 (天)
                    </label>
                    <input type="number" id="days" value="35" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3 text-sky-300 font-mono outline-none focus:border-sky-500/50 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/5">
                    <div class="flex flex-col">
                        <span class="text-[11px] text-slate-400 uppercase tracking-tighter">购买大月卡</span>
                        <span class="text-[10px] text-emerald-500 font-bold">+2400</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="battlePass" class="sr-only peer">
                        <div class="w-10 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-500"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between bg-white/5 p-4 rounded-xl border border-white/5">
                    <div class="flex flex-col w-3/4">
                        <span class="text-[11px] text-slate-400 uppercase tracking-tighter">版本常驻福利</span>
                        <span id="versionTip" class="text-[9px] text-sky-400 font-mono truncate">周常 + 常驻池</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="autoVersionRewards" class="sr-only peer" checked>
                        <div class="w-10 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-500"></div>
                    </label>
                </div>
            </div>

            <div class="bg-white/5 p-5 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-3">
                    <label class="flex items-center text-xs text-slate-400">
                        <i data-lucide="refresh-cw" class="w-3 h-3 mr-2"></i> 信用商店刷新次数
                    </label>
                    <span class="text-sky-400 font-mono font-bold text-sm"><span id="refreshVal">4</span> 次</span>
                </div>
                <input type="range" id="refreshes" min="0" max="4" value="4" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="pt-4">
                <div class="grid grid-cols-1 gap-4">
                    <div class="p-6 bg-gradient-to-br from-slate-950 to-slate-900 rounded-2xl border border-sky-500/20 relative">
                        <i data-lucide="sparkles" class="absolute top-4 right-4 w-5 h-5 text-sky-500/20"></i>
                        <div class="text-slate-500 text-[10px] mb-1 uppercase tracking-[0.2em]">预估总产出配额</div>
                        <div id="totalResult" class="text-4xl font-mono font-black text-sky-400 drop-shadow-[0_0_15px_rgba(56,189,248,0.3)]">0</div>
                    </div>
                    
                    <div class="flex items-center justify-between px-3 py-1">
                        <div class="flex flex-col">
                            <span class="text-slate-500 text-[10px] uppercase tracking-wider">等效武器抽数</span>
                            <span id="weaponEquiv" class="text-2xl font-bold text-emerald-400">0 抽</span>
                        </div>
                        <div class="text-right">
                            <span class="text-slate-500 text-[10px] block uppercase tracking-wider">预期获得概率</span>
                            <span id="progress" class="text-slate-300 font-mono text-lg font-bold">0.00%</span>
                        </div>
                    </div>
                </div>
                <p id="tierTip" class="text-center text-[10px] text-slate-600 italic mt-4"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();
    </script>
</body>
</html>
